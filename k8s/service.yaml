# Exposes the API outside the cluster. With Minikube: minikube service tsanalyzer --url
apiVersion: v1
kind: Service
metadata:
  name: tsanalyzer
  labels:
    app: tsanalyzer
spec:
  type: NodePort
  selector:
    app: tsanalyzer
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
