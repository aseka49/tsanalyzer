# Continuous Delivery: pushing a tag like v1.0.0 runs the tests again,
# builds the package and publishes a GitHub Release with the wheel and sdist attached.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          pip install -e ".[dev]"
          pytest
      - name: Check tag matches package version
        run: |
          PKG_VERSION=$(python -c "import tsanalyzer; print(tsanalyzer.__version__)")
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${PKG_VERSION}"; exit 1
          fi
      - name: Build
        run: python -m build
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "tsanalyzer ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md
